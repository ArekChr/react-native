# Copies Test All's test result artifacts, plus a description of the run, to
# GCS for test history. Runs from the default branch after every Test All run,
# including pull requests from forks. The artifacts are copied as inert data:
# nothing in them is executed, and they are validated where they're read.
name: Upload Test Results

on:
  workflow_run:
    workflows: [Test All]
    types: [completed]

permissions: {}

jobs:
  upload:
    # Nothing runs until the repository has GCP credentials configured.
    if: |
      vars.VISUAL_GCP_PROJECT != '' &&
      vars.VISUAL_WORKLOAD_IDENTITY_PROVIDER != '' &&
      vars.VISUAL_BUCKET != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
      DEST: /tmp/test-results/${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
      # Every key under this prefix is written once, so a rerun of this
      # workflow skips what an earlier attempt already uploaded.
      PREFIX: gs://${{ vars.VISUAL_BUCKET }}/verify/incoming/${{ github.repository }}/${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
    steps:
      - name: Download test results
        run: |
          set -euo pipefail
          mkdir -p "$DEST/artifacts"
          # Every artifact from this attempt, so recordings and logs can be
          # linked. A rerun of this workflow for an earlier attempt can see
          # artifacts that a later attempt replaced, so anything newer than the
          # attempt is left out.
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '.artifacts[]' |
            jq --slurp --arg base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" '[.[]
              | select(.created_at <= env.RUN_UPDATED_AT)
              | {id, name, sizeInBytes: .size_in_bytes, createdAt: .created_at, expiresAt: .expires_at, expired, url: "\($base)/\(.id)"}]' \
            > "$DEST/artifacts.json"
          # Only small per-flow E2E state artifacts are downloaded.
          jq -r '.[]
            | select((.expired | not) and .sizeInBytes <= 1048576)
            | select(.name | test("^e2e_[a-z]+_[a-z]+_state_[A-Za-z0-9_-]+$"))
            | "\(.id) \(.name)"' "$DEST/artifacts.json" |
          while read -r ID NAME; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > "/tmp/artifact-$ID.zip"
            # Extract only results.json, so paths inside the archive are never used.
            if unzip -p "/tmp/artifact-$ID.zip" results.json 2>/dev/null | head -c 1048577 > "/tmp/results-$ID.json" &&
              [[ -s "/tmp/results-$ID.json" ]] && (( $(wc -c < "/tmp/results-$ID.json") <= 1048576 )); then
              mkdir -p "$DEST/artifacts/$NAME"
              mv "/tmp/results-$ID.json" "$DEST/artifacts/$NAME/results.json"
            else
              echo "Skipping $NAME: no results.json, or it's too large"
            fi
          done
          find "$DEST" -type f
      - name: Describe the run
        env:
          WORKFLOW_RUN: ${{ toJSON(github.event.workflow_run) }}
          REPO_ID: ${{ github.event.repository.id }}
        run: |
          # pull_requests omits fork PRs and can list unrelated PRs on a push,
          # so only PRs into this repository are kept, and only for pull
          # request runs. The head repository and branch identify a fork PR.
          jq --argjson repoId "$REPO_ID" '{
            repository: .repository.full_name,
            runId: .id,
            runAttempt: .run_attempt,
            event,
            conclusion,
            headSha: .head_sha,
            headBranch: .head_branch,
            headRepository: .head_repository.full_name,
            pullRequests: (if .event == "pull_request"
              then [.pull_requests[] | select(.base.repo.id == $repoId) | .number]
              else [] end),
            createdAt: .created_at,
            runStartedAt: .run_started_at,
            updatedAt: .updated_at,
            url: .html_url
          }' <<< "$WORKFLOW_RUN" > "$DEST/run.json"
          cat "$DEST/run.json"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.VISUAL_GCP_PROJECT }}
          workload_identity_provider: ${{ vars.VISUAL_WORKLOAD_IDENTITY_PROVIDER }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Upload
        run: |
          set -euo pipefail
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "Attempt $attempt failed"
              sleep $((attempt * 10))
            done
            return 1
          }
          if [[ -n "$(ls -A "$DEST/artifacts")" ]]; then
            retry gcloud storage cp --recursive --no-clobber "$DEST/artifacts" "$PREFIX/"
          fi
          retry gcloud storage cp --no-clobber "$DEST/artifacts.json" "$PREFIX/artifacts.json"
          # A run is complete once its run.json exists, so it goes last.
          retry gcloud storage cp --no-clobber "$DEST/run.json" "$PREFIX/run.json"
